name: Native preview builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm test
        env:
          FIN_BUDDY_PYTHON: python
      - run: npm run mobile:model
      - run: npm run mobile:android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: fin-buddy-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run mobile:model
      - run: npm run mobile:ios
      - run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/ios/App
      - uses: actions/upload-artifact@v4
        with:
          name: fin-buddy-ios-simulator
          path: mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
